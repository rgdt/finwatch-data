name: snapshot

# Produit les instantanés de marché lus par les briefs Financial Watchtower.
#
# Toutes les trois heures, et non à heure fixe avant chaque brief.
#
# Mesuré sur ce dépôt : les workflows planifiés GitHub partent avec 4 h 52 à
# 6 h 37 de retard sur l'heure demandée. La file des schedules est à faible
# priorité et peut même sauter un créneau. Viser une heure précise est donc
# illusoire ; la parade est la fréquence — huit tentatives par jour, dont une
# au moins aura produit un instantané récent avant chaque brief.
#
# Conséquence : plus d'heure d'été à corriger, et plus de découpage par région.
# Chaque exécution produit les deux instantanés. Le brief lit le plus récent et
# vérifie lui-même sa fraîcheur.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Région à rafraîchir'
        type: choice
        options: [both, eu, us]
        default: both

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install --quiet -r requirements.txt
      - name: Déterminer la région
        id: region
        # Une exécution planifiée produit les deux régions ; seul un
        # déclenchement manuel peut en cibler une.
        run: echo "value=${{ inputs.region || 'both' }}" >> "$GITHUB_OUTPUT"

      - name: Construire l'univers s'il manque
        run: |
          for r in eu us; do
            if [ ! -s "universe/$r.txt" ]; then
              echo "univers $r absent, construction"
              python scripts/build_universe.py "$r"
            fi
          done

      - name: Produire le snapshot
        run: |
          case "${{ steps.region.outputs.value }}" in
            eu)   python scripts/fetch_snapshot.py eu ;;
            us)   python scripts/fetch_snapshot.py us ;;
            both) python scripts/fetch_snapshot.py eu
                  python scripts/fetch_snapshot.py us ;;
          esac

      - name: Publier
        run: |
          git config user.name  'watchtower-bot'
          git config user.email 'watchtower-bot@users.noreply.github.com'
          git add data/ universe/
          if git diff --cached --quiet; then
            echo "aucun changement"
            exit 0
          fi
          git commit -m "snapshot ${{ steps.region.outputs.value }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Une exécution manuelle peut chevaucher une exécution planifiée.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push échoué, nouvelle tentative ($attempt/3)"
            sleep 5
          done
          exit 1
