name: snapshot

# Produit les instantanés de marché lus par les briefs Financial Watchtower.
#
# Les heures sont en UTC. Marge de 35 min avant chaque brief, pour absorber la
# latence d'ordonnancement des runners GitHub (5 à 15 min aux heures de pointe).
#
#                        heure d'été (UTC+2)   heure d'hiver (UTC+1)
#   snapshot EU              04:55 UTC             05:55 UTC
#   brief EU  (07h30 Paris)  05:30 UTC             06:30 UTC
#   snapshot US              11:25 UTC             12:25 UTC
#   brief US  (14h00 Paris)  12:00 UTC             13:00 UTC
#
# ⚠️ À corriger au passage à l'heure d'hiver, le 25 octobre 2026.

on:
  schedule:
    - cron: '55 4 * * 1-5'    # snapshot EU
    - cron: '25 11 * * 1-5'   # snapshot US
  workflow_dispatch:
    inputs:
      region:
        description: 'Région à rafraîchir'
        type: choice
        options: [both, eu, us]
        default: both

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install --quiet -r requirements.txt
      - name: Déterminer la région
        id: region
        run: |
          case "${{ github.event.schedule }}" in
            '55 4 * * 1-5')  echo "value=eu" >> "$GITHUB_OUTPUT" ;;
            '25 11 * * 1-5') echo "value=us" >> "$GITHUB_OUTPUT" ;;
            *)               echo "value=${{ inputs.region || 'both' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Construire l'univers s'il manque
        run: |
          for r in eu us; do
            if [ ! -s "universe/$r.txt" ]; then
              echo "univers $r absent, construction"
              python scripts/build_universe.py "$r"
            fi
          done

      - name: Produire le snapshot
        run: |
          case "${{ steps.region.outputs.value }}" in
            eu)   python scripts/fetch_snapshot.py eu ;;
            us)   python scripts/fetch_snapshot.py us ;;
            both) python scripts/fetch_snapshot.py eu
                  python scripts/fetch_snapshot.py us ;;
          esac

      - name: Publier
        run: |
          git config user.name  'watchtower-bot'
          git config user.email 'watchtower-bot@users.noreply.github.com'
          git add data/ universe/
          if git diff --cached --quiet; then
            echo "aucun changement"
            exit 0
          fi
          git commit -m "snapshot ${{ steps.region.outputs.value }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Une exécution manuelle peut chevaucher une exécution planifiée.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push échoué, nouvelle tentative ($attempt/3)"
            sleep 5
          done
          exit 1
